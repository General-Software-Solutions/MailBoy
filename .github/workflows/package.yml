# Builds the Chrome Web Store zip. Push a tag matching the manifest version
# (git tag v0.2.0 && git push origin v0.2.0), or run it by hand from the
# Actions tab, then download the zip from the run's Artifacts and upload it in
# the Developer Dashboard.
#
# Needs one repository secret, MAILBOY_CLIENT_ID: the OAuth client ID that
# src/config.js holds locally. The client ID is not a credential in the
# password sense, since it ships inside the package. It stays out of the repo
# because a copied client ID routes sign-ins through this project (see README).

name: Package extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Syntax-check every script
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.js -Path . |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|node_modules)[\\/]' } |
            ForEach-Object {
              node --check $_.FullName
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          if ($failed) { exit 1 }

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content -Raw manifest.template.json | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag does not match manifest version $version."
            exit 1
          }

      - name: Build the zip
        id: build
        env:
          MAILBOY_CLIENT_ID: ${{ secrets.MAILBOY_CLIENT_ID }}
        run: |
          ./tools/package.ps1 -OutDir dist
          $version = (Get-Content -Raw manifest.template.json | ConvertFrom-Json).version
          "zip=dist/mailboy-$version.zip" >> $env:GITHUB_OUTPUT

      # archive: false uploads the zip as it is. Without it GitHub wraps the
      # artifact in a zip of its own, and the store wants the inner one. The
      # artifact is then named after the file, and `name` is ignored.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.zip }}
          archive: false
          if-no-files-found: error
          retention-days: 30
