<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Deep elegant gold gradient -->
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4E0F"/>
      <stop offset="50%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#A67C1A"/>
    </linearGradient>
  </defs>


  <defs>
    <!-- Metallic deep gold gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4A3A12"/>
      <stop offset="25%"  stop-color="#6B4E0F"/>
      <stop offset="50%"  stop-color="#8B6914"/>
      <stop offset="75%"  stop-color="#A67C1A"/>
      <stop offset="100%" stop-color="#5C4A15"/>
    </linearGradient>
  </defs>

  <!-- Deep elegant gold background with gradient -->
  <rect x="0" y="10" width="200" height="190" fill="url(#metallicGold)" rx="25" ry="25"/>
  

   <!-- Thick Deep black V stroke -->
  <path d="m45,60 l55,50 55,-50"
        fill="none"
        stroke="#1A1A1A"
        stroke-width="25"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Left Deep black pillar -->
  <path d="m35,160 h20 v-100 h-20z"
        fill="#1A1A1A"
        stroke="#1A1A1A"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Right Deep black pillar -->
  <path d="m145,160 h20 v-100 h-20z"
        fill="#1A1A1A"
        stroke="#1A1A1A"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <path d="m145,130 h20 v-10 h-20z"
        fill="#6B0F1A"
        stroke="#6B0F1A"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Deep black icon area -->
  <!-- <rect x="60" y="60" width="180" height="180" fill="#1A1A1A" rx="3"/> -->
  
  <!-- Deep red ribbon accent -->
  <!-- <rect x="100" y="100" width="100" height="100" fill="#6B0F1A" rx="2"/> -->
</svg>